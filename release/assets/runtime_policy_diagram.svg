<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400">
<style>text{font-family:Arial,sans-serif;font-size:17px;fill:#1f2933}.small{font-size:13px;fill:#52606d}.box{fill:#f5f7fa;stroke:#52606d;stroke-width:2;rx:10}.ok{fill:#e8f4ff;stroke:#2f6fbb}.fast{fill:#ecfdf3;stroke:#499f68}.warn{fill:#fff8e6;stroke:#c07a2c}.reject{fill:#fff1f1;stroke:#cc4b4b}</style>
<text x="490" y="35" text-anchor="middle" style="font-size:24px;font-weight:bold">Frozen runtime/model policy</text>
<rect class="ok" x="45" y="70" width="260" height="95"/><text x="175" y="106" text-anchor="middle">Primary visual</text><text class="small" x="175" y="132" text-anchor="middle">dynamic640 INT8 on rt201</text><text class="small" x="175" y="152" text-anchor="middle">image + normal camera</text>
<rect class="fast" x="360" y="70" width="260" height="95"/><text x="490" y="106" text-anchor="middle">Fast-live</text><text class="small" x="490" y="132" text-anchor="middle">vendor320 INT8 on rt123</text><text class="small" x="490" y="152" text-anchor="middle">320 letterbox</text>
<rect class="ok" x="675" y="70" width="260" height="95"/><text x="805" y="106" text-anchor="middle">Vendor320 trusted</text><text class="small" x="805" y="132" text-anchor="middle">visual on rt123</text><text class="small" x="805" y="152" text-anchor="middle">raw rt201 is perf-only</text>
<rect class="warn" x="45" y="220" width="260" height="95"/><text x="175" y="256" text-anchor="middle">Non-default workaround</text><text class="small" x="175" y="282" text-anchor="middle">vendor320 rt201 visual</text><text class="small" x="175" y="302" text-anchor="middle">SHA256-guarded, slower</text>
<rect class="warn" x="360" y="220" width="260" height="95"/><text x="490" y="256" text-anchor="middle">Experimental FP16</text><text class="small" x="490" y="282" text-anchor="middle">keep_io 640 on rt201/rt202b1</text><text class="small" x="490" y="302" text-anchor="middle">not a production default</text>
<rect class="reject" x="675" y="220" width="260" height="95"/><text x="805" y="256" text-anchor="middle">Rejected / P2</text><text class="small" x="805" y="282" text-anchor="middle">stable rt202, YOLO26n, FP16 320</text><text class="small" x="805" y="302" text-anchor="middle">post-release only</text>
</svg>